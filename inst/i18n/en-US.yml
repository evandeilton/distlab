sim.rel.col.frame: Step
sim.rel.col.distance: Distance
sim.rel.note.draws: >-
  The histogram builds up as draws accumulate.
sim.rel.note.sum: >-
  Each frame adds terms to the sum, and its exact law changes with the number
  of terms k.
sim.rel.note.limit: >-
  No draws: the approximating law is computed exactly, and the distance to
  the limit law shrinks along the frames.
sim.metric.ks: Kolmogorov–Smirnov distance sup|F̂ − F| to the exact law
sim.metric.tv: Total variation distance to the exact law
sim.metric.kolmogorov: Kolmogorov distance sup|F − G| between the two laws
sim.mem.intro: >-
  After waiting until s without the event, is the remaining wait X − s like
  starting over? Only for the Exponential and, for counts, the Geometric.
sim.mem.s: Threshold s
sim.mem.survival: Survival of X and of the residual
sim.mem.hist: Residuals X − s and the law of X
sim.mem.law_x: Law of X
sim.mem.ylab: Survival probability
sim.mem.verdict.yes: >-
  Memoryless: the residual X − s has the same law as X, whatever s is.
sim.mem.verdict.no: >-
  Not memoryless: the residual X − s has a different law from X.
sim.mem.kept: "{kept} of {n} draws passed s."
sim.mem.gap: "Largest gap between the two survival curves: {gap}."
sim.mem.note.discrete: >-
  For counts the residual is X − s given X ≥ s; the Geometric counts the
  failures before the first success, starting at 0.
sim.mem.unsupported: >-
  Memorylessness concerns waiting times: distributions with support [0, ∞).
sim.mem.to_exp: Switch to the Exponential
sim.error.seed: The seed must be a whole number from 1 to 2147483647.
sim.error.ab: "Enter numbers for a and b between −{max} and {max}."
sim.error.log_support: >-
  log(X) needs X > 0: choose a distribution whose support lies in (0, ∞).
sim.error.affine_b: The slope b must not be 0, since a + 0·X is a constant.
sim.error.memoryless_support: >-
  Memorylessness concerns waiting times: distributions with support [0, ∞).
sim.error.memoryless_few: >-
  Fewer than 30 draws passed s; choose a smaller s or more draws.
sim.error.engine: The simulation could not be run with these values.
sim.clt.note.no_mean: >-
  The mean does not exist, so the means cannot be standardized and the raw
  means do not narrow as n grows: the mean of n Cauchy draws is again the
  same Cauchy.
sim.clt.note.infinite_mean: >-
  The mean is infinite, so the means cannot be standardized: the raw means
  drift upward and do not settle as n grows.
sim.clt.note.infinite_var: >-
  The mean exists but the variance is infinite: the raw means narrow, but
  slowly, and there is no √n scaling with a Normal limit.
sim.rel.col.band_ks: 95% noise level
sim.rel.col.band_tv: Expected noise level
sim.rel.note.band_ks: >-
  A Kolmogorov–Smirnov distance below the 95% noise level 1.36/√n agrees with
  the exact law.
sim.rel.note.band_tv: >-
  Even draws from the exact law leave a total variation distance of about
  ½ Σ √(2p(1 − p)/(πn)), the expected noise level; a distance close to it
  agrees with the exact law.
sim.mem.verdict.special: "With these parameters the {law} is the {base}."
