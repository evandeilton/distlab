sim.sample.intro: >-
  A sample drawn with the seed, compared with the exact law. The 95%
  intervals of the mean and of the probabilities should hold the exact value
  in about 95 of 100 seeds; the variance interval holds it less often for
  heavy-tailed laws (large excess kurtosis).
sim.sample.check: Monte Carlo check
sim.col.quantity: Quantity
sim.col.exact: Exact
sim.col.estimate: Estimate
sim.col.se: Std. error
sim.col.interval: 95% interval
sim.col.covered: Holds the exact value
sim.covered.yes: "yes"
sim.covered.no: "no"
sim.covered.na: no interval
sim.lln.intro: >-
  The mean of the first k draws, for k = 1, 2, …, n, in independent paths.
  When the mean exists, every path settles at it.
sim.lln.paths: Number of paths
sim.lln.log: Logarithmic k axis
sim.lln.xlab: Number of draws k
sim.lln.ylab: Mean of the first k draws
sim.lln.path: "Path {n}"
sim.lln.note.band: >-
  The running means settle at the mean μ = {mu}; for each k, about 95% of
  the running means fall in the band μ ± 2σ/√k, which narrows as k grows.
sim.lln.note.no_mean: >-
  This distribution has no mean, so the running means never settle: a single
  extreme draw can move them at any time, however large k is.
sim.lln.note.infinite_mean: >-
  The mean is infinite, so the running means keep drifting upward without
  settling.
sim.lln.note.infinite_var: >-
  The mean μ = {mu} exists but the variance is infinite: the running means
  still converge, slowly, and there is no μ ± 2σ/√k band.
sim.clt.intro: >-
  Means of samples of size n, standardized as (X̄ − μ)/(σ/√n). Press Play to
  watch the histogram approach the standard Normal as n grows.
sim.clt.reps: Samples per size
sim.clt.xlab: (X̄ − μ) / (σ/√n)
sim.clt.xlab_raw: Sample mean X̄
sim.clt.col.size: Sample size n
sim.clt.col.ks: Distance to N(0, 1)
sim.metric.clt: "Kolmogorov distance sup|F̂ − Φ| between the standardized means and N(0, 1)"
sim.clt.note: >-
  Each frame shows the standardized means of the samples of size n. The
  distance to N(0, 1) shrinks as n grows, as the central limit theorem says.
sim.clt.note.discrete: >-
  The draws are whole numbers, so the means fall on a grid with spacing
  1/(σ√n); the bars sit on that grid, and the distance falls more slowly for
  small n.
sim.transform.intro: >-
  Y is computed from independent draws of X; when Y follows a distribution
  of the catalog, its exact law is drawn over the histogram.
