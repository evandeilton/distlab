sim.sample.intro: >-
  A sample drawn with the seed, compared with the exact law. The 95%
  intervals of the mean and of the probabilities should hold the exact value
  in about 95 of 100 seeds; the variance interval holds it less often for
  heavy-tailed laws (large excess kurtosis).
