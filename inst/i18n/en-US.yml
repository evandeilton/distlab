calc.sentence.quantile: "The quantile of order {p} is {x}: P(X ≤ {x}) = {p}."
calc.sentence.quantile_discrete: "The smallest x with F(x) ≥ {p} is {x}; P(X ≤ {x}) = {fx}."
calc.sentence.central: >-
  An interval holding {prob} of the probability in the center is [{a}, {b}],
