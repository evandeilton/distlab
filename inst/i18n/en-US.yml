calc.prob_label: Probability of the interval
calc.help.p: >-
  Probability p between 0 and 1; the result is the x with P(X ≤ x) = p, or
  the first x past p when X is discrete.
calc.help.prob: Probability between 0 and 1, split equally between the two tails.
calc.help.decimal: >-
  Use a decimal point (1.5). A comma followed by groups of three digits
  separates thousands (1,234 is 1234). Inf and -Inf are accepted.
calc.result: Result
calc.lower_end: Left end
calc.upper_end: Right end
calc.note.continuous_ends: >-
  For a continuous distribution P(X = a) = 0, so < and ≤ give the same
  probability.
calc.note.discrete_ends: >-
  For a discrete distribution the ends matter: ≤ counts the probability at
  that value, < leaves it out.
calc.note.quantile_discrete: >-
  A discrete CDF jumps at whole numbers, so usually no x has F(x) = p
  exactly. The quantile is the smallest x with F(x) ≥ p, the rule used by R.
calc.note.tiny: >-
  Tail probabilities are computed directly on the upper or lower tail and on
  the log scale, so they keep their precision.
calc.note.outside: >-
  A value lies outside the support of X, where the distribution puts no
  probability.
