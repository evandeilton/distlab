compare.preset.poisson_lambda: Poisson λ sweep
compare.preset.binom_pois.hint: >-
  With many trials and a small success probability, Binomial(50, 0.06) is
  close to Poisson(3), with the same mean np = 3.
compare.preset.t_normal.hint: >-
  Student's t has heavier tails than the Normal; as ν grows it approaches the
  Normal. With ν = 1 it is the Cauchy, with no mean.
compare.preset.gamma_shape.hint: >-
  The shape α changes the form of the Gamma: below 1 the density is
  unbounded at 0, at 1 it is the Exponential, and it grows more symmetric as
  α increases.
compare.preset.beta_shapes.hint: >-
  The two shapes of the Beta move mass across (0, 1): U-shaped, skewed to
  either side or symmetric.
compare.preset.exp_weibull.hint: >-
  The Weibull with shape 1 is the Exponential (the curves coincide); shape 2
  gives a hump and a lighter tail.
compare.preset.poisson_lambda.hint: >-
  As λ grows the Poisson moves right, spreads out (variance λ) and becomes
  more symmetric.
