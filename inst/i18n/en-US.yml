calc.error.range: The number is too large to compute (beyond about 1.8e308).
calc.note.thousands: "{text} was read as {value} (thousands separator)."
calc.error.order: The left end a must not be greater than b.
calc.error.p: The probability must be strictly between 0 and 1.
