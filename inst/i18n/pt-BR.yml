sim.mem.verdict.no: >-
  Com memória: o resíduo X − s tem uma lei diferente da de X.
sim.mem.kept: "{kept} de {n} sorteios passaram de s."
sim.mem.gap: "Maior diferença entre as duas curvas de sobrevivência: {gap}."
sim.mem.note.discrete: >-
