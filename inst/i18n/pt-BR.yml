about.text: >-
  O distlab é um laboratório interativo para estudar distribuições de
  probabilidade.
about.details: >-
  Todo número na tela vem de fórmulas fechadas ou de integração numérica
  controlada, e as fórmulas seguem a notação dos livros-texto de referência.
