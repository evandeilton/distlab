sim.mem.intro: >-
  Depois de esperar até s sem o evento, a espera restante X − s é como
  começar de novo? Só para a Exponencial e, entre as contagens, a Geométrica.
sim.mem.s: Limiar s
sim.mem.survival: Sobrevivência de X e do resíduo
sim.mem.hist: Resíduos X − s e a lei de X
sim.mem.law_x: Lei de X
sim.mem.ylab: Probabilidade de sobrevivência
sim.mem.verdict.yes: >-
