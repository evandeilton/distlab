sim.lln.intro: >-
  A média dos k primeiros sorteios, para k = 1, 2, …, n, em trajetórias
  independentes. Quando a média existe, toda trajetória se estabiliza nela.
sim.lln.paths: Número de trajetórias
sim.lln.log: Eixo k logarítmico
sim.lln.xlab: Número de sorteios k
sim.lln.ylab: Média dos k primeiros sorteios
sim.lln.path: "Trajetória {n}"
sim.lln.note.band: >-
  As médias acumuladas se estabilizam na média μ = {mu}; cerca de 95% delas
  ficam na faixa μ ± 2σ/√k, que se estreita à medida que k cresce.
sim.lln.note.no_mean: >-
  Esta distribuição não tem média, então as médias acumuladas nunca se
  estabilizam: um único sorteio extremo pode deslocá-las a qualquer momento,
  por maior que seja k.
sim.lln.note.infinite_mean: >-
  A média é infinita, então as médias acumuladas continuam subindo sem se
  estabilizar.
sim.lln.note.infinite_var: >-
  A média μ = {mu} existe, mas a variância é infinita: as médias acumuladas
  ainda convergem, devagar, e não há faixa μ ± 2σ/√k.
sim.clt.intro: >-
  Médias de amostras de tamanho n, padronizadas como (X̄ − μ)/(σ/√n). Clique
  em Reproduzir para ver o histograma se aproximar da Normal padrão quando n
  cresce.
sim.clt.reps: Amostras por tamanho
sim.clt.xlab: (X̄ − μ) / (σ/√n)
sim.clt.xlab_raw: Média amostral X̄
sim.clt.col.size: Tamanho da amostra n
sim.clt.col.ks: Distância à N(0, 1)
sim.metric.clt: "Distância de Kolmogorov sup|F̂ − Φ| entre as médias padronizadas e a N(0, 1)"
sim.clt.note: >-
  Cada quadro mostra as médias padronizadas das amostras de tamanho n. A
  distância à N(0, 1) diminui quando n cresce, como diz o Teorema Central do
  Limite.
sim.clt.note.discrete: >-
  Os sorteios são números inteiros, então as médias caem numa grade e a
  distância diminui mais devagar para n pequeno.
sim.clt.note.raw: >-
  A variância não é finita, então as médias não podem ser padronizadas e o
  Teorema Central do Limite não se aplica: o histograma das médias não se
  estreita quando n cresce. A média de n sorteios de uma Cauchy é de novo
  Cauchy.
sim.transform.intro: >-
  Y é calculado a partir de sorteios independentes de X; quando Y segue uma
