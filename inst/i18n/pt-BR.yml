calc.note.discrete_ends: >-
  Numa distribuição discreta os extremos importam: ≤ conta a probabilidade
  daquele valor, < a deixa de fora.
calc.note.quantile_discrete: >-
  A função de distribuição discreta salta nos inteiros, então em geral nenhum
  x tem F(x) = p exatamente. O quantil é o menor x com F(x) ≥ p, a regra
  usada pelo R.
calc.note.tiny: >-
  Probabilidades de cauda são calculadas diretamente na cauda superior ou
  inferior e em escala logarítmica, então mantêm a precisão.
calc.note.outside: >-
  Um valor está fora do suporte de X, onde a distribuição não põe
  probabilidade.
