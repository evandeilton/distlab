fit.failure_support: "As observações violam o suporte desta família ou estão em uma extremidade não regular."
fit.failure_likelihood: "Nenhuma verossimilhança finita foi encontrada. Confira o suporte e os parâmetros fixos."
fit.failure_boundary: "Não foi encontrada uma estimativa interior finita e estável: o otimizador se aproxima de uma fronteira ou família limite."
fit.failure_information: "A informação observada é singular ou não é positiva definida no ótimo; estes dados não identificam uma estimativa finita estável."
fit.warning_student: "A t de Student estima apenas df. A localização é fixa em 0 e a escala em 1, conforme o catálogo."
