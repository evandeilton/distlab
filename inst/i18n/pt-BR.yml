calc.help.p: >-
  Probabilidade p entre 0 e 1; o resultado é o x com P(X ≤ x) = p, ou o
  primeiro x que passa de p quando X é discreta.
calc.help.prob: Probabilidade entre 0 e 1, dividida igualmente entre as duas caudas.
calc.help.decimal: Use vírgula ou ponto decimal; Inf e -Inf são aceitos.
calc.result: Resultado
calc.lower_end: Extremo esquerdo
calc.upper_end: Extremo direito
calc.note.continuous_ends: >-
  Numa distribuição contínua P(X = a) = 0, então < e ≤ dão a mesma
  probabilidade.
calc.note.discrete_ends: >-
  Numa distribuição discreta os extremos importam: ≤ conta a probabilidade
  daquele valor, < a deixa de fora.
calc.note.quantile_discrete: >-
  A função de distribuição discreta salta nos inteiros, então em geral nenhum
  x tem F(x) = p exatamente. O quantil é o menor x com F(x) ≥ p, a regra
  usada pelo R.
calc.note.tiny: >-
  Probabilidades de cauda são calculadas diretamente na cauda superior ou
  inferior e em escala logarítmica, então mantêm a precisão.
calc.note.outside: >-
  Um valor está fora do suporte de X, onde a distribuição não põe
  probabilidade.
