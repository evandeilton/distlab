  Uma amostra sorteada com a semente, comparada com a lei exata. Os
  intervalos de 95% da média e das probabilidades devem conter o valor exato
  em cerca de 95 de 100 sementes; o intervalo da variância o contém menos
  vezes para leis de caudas pesadas (excesso de curtose grande).
