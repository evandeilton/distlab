compare.subtitle: >-
  Sobreponha distribuições, ou varie um parâmetro, para ver como formas,
  centros e caudas diferem.
compare.presets: Exemplos
compare.preset.binom_pois: Binomial(n, p) vs Poisson(np)
compare.preset.t_normal: t(ν) vs Normal
compare.preset.gamma_shape: Variando a forma da Gama
compare.preset.beta_shapes: Formas da Beta
compare.preset.exp_weibull: Exponencial vs Weibull
compare.preset.poisson_lambda: Variando o λ da Poisson
compare.preset.binom_pois.hint: >-
  Com muitos ensaios e probabilidade de sucesso pequena, a Binomial(50; 0,06)
  fica próxima da Poisson(3), com a mesma média np = 3.
compare.preset.t_normal.hint: >-
  A t de Student tem caudas mais pesadas que a Normal; quando ν cresce, ela se
  aproxima da Normal. Com ν = 1 é a Cauchy, que não tem média.
compare.preset.gamma_shape.hint: >-
  A forma α muda o desenho da Gama: abaixo de 1 a densidade é ilimitada em 0,
  em 1 é a Exponencial, e fica mais simétrica conforme α aumenta.
compare.preset.beta_shapes.hint: >-
  Os dois parâmetros de forma da Beta deslocam a massa em (0, 1): em U,
  assimétrica para um dos lados ou simétrica.
compare.preset.exp_weibull.hint: >-
  A Weibull com forma 1 é a Exponencial (as curvas coincidem); forma 2 dá uma
  corcova e uma cauda mais leve.
compare.preset.poisson_lambda.hint: >-
  Conforme λ cresce, a Poisson se desloca para a direita, se espalha
  (variância λ) e fica mais simétrica.
compare.preset_none: Escolha um exemplo ou monte a sua comparação.
