sim.clt.note.no_mean: >-
  A média não existe, então as médias não podem ser padronizadas e as médias
  brutas não se estreitam quando n cresce: a média de n sorteios de uma Cauchy
  é de novo a mesma Cauchy.
sim.clt.note.infinite_mean: >-
  A média é infinita, então as médias não podem ser padronizadas: as médias
  brutas sobem e não se estabilizam quando n cresce.
sim.clt.note.infinite_var: >-
  A média existe, mas a variância é infinita: as médias brutas se estreitam,
  mas devagar, e não há escala √n com limite Normal.
sim.rel.col.band_ks: Nível de ruído de 95%
sim.rel.col.band_tv: Nível de ruído esperado
sim.rel.note.band_ks: >-
  Uma distância de Kolmogorov–Smirnov abaixo do nível de ruído de 95%,
  1,36/√n, está de acordo com a lei exata.
sim.rel.note.band_tv: >-
  Mesmo sorteios da lei exata deixam uma distância de variação total de cerca
  de ½ Σ √(2p(1 − p)/(πn)), o nível de ruído esperado; uma distância próxima
  dele está de acordo com a lei exata.
