id: lognormal
names:
  en-US: Lognormal
  pt-BR: Lognormal
type: continuous
group: positive
subgroup: normal_family
tier: 1
graph: {xy: [-520, 0]}
support:
  lower: 0
  lower_open: true
  upper: .inf
parameters:
  - name: meanlog
    latex: "\\mu"
    lower: -.inf
    upper: .inf
    default: 0
    slider: {min: -3, max: 3, step: 0.1}
  - name: sdlog
    latex: "\\sigma"
    lower: 0
    lower_open: true
    upper: .inf
    default: 0.5
    slider: {min: 0.1, max: 2, step: 0.05}
functions:
  d: stats::dlnorm
  p: stats::plnorm
  q: stats::qlnorm
  r: stats::rlnorm
latex:
  pdf: "f(x) = \\frac{1}{x \\sigma \\sqrt{2\\pi}} \\exp\\left\\{-\\frac{(\\log x - \\mu)^2}{2\\sigma^2}\\right\\}, \\quad x > 0"
  cdf: "F(x) = \\Phi\\left(\\frac{\\log x - \\mu}{\\sigma}\\right)"
  quantile:
    expr: "\\exp\\left(\\mu + \\sigma \\Phi^{-1}(u)\\right)"
  mean:
    expr: "e^{\\mu + \\sigma^{2}/2}"
  variance:
    expr: "\\left(e^{\\sigma^{2}} - 1\\right) e^{2\\mu + \\sigma^{2}}"
  skewness:
    expr: "\\left(e^{\\sigma^{2}} + 2\\right) \\sqrt{e^{\\sigma^{2}} - 1}"
  excess_kurtosis:
    expr: "e^{4\\sigma^{2}} + 2 e^{3\\sigma^{2}} + 3 e^{2\\sigma^{2}} - 6"
  raw_moment:
    expr: "e^{j \\mu + j^{2} \\sigma^{2}/2}"
  mgf:
    - expr: null
      condition: "t \\le 0"
    - status: infinite
      condition: "t > 0"
  cf:
    expr: null
  median:
    expr: "e^{\\mu}"
  mode:
    expr: "e^{\\mu - \\sigma^{2}}"
  entropy:
    expr: "\\mu + \\frac{1}{2} \\log\\left(2 \\pi e \\sigma^{2}\\right)"
story:
  en-US: >-
    Multiply many small, independent positive factors and the logarithm of
    the product is a sum, which tends to a Normal. The product itself is then
    Lognormal: positive and skewed to the right, as incomes, particle sizes
    and stock prices often are. Here mu and sigma are the mean and standard
    deviation of log X, not of X.
  pt-BR: >-
    Multiplique muitos fatores positivos, pequenos e independentes: o
    logaritmo do produto é uma soma, que tende a uma Normal. O próprio produto
    é então Lognormal: positivo e assimétrico à direita, como costumam ser
    rendas, tamanhos de partículas e preços de ações. Aqui mu e sigma são a
    média e o desvio-padrão de log X, não de X.
relationships:
  - to: normal
    type: transformation
    label: "log X"
    condition:
      en-US: "The logarithm of a Lognormal(mu, sigma) variable is Normal(mu, sigma)."
      pt-BR: "O logaritmo de uma variável Lognormal(mu, sigma) é Normal(mu, sigma)."
    latex: "X \\sim \\mathrm{Lognormal}(\\mu, \\sigma) \\Rightarrow \\log X \\sim N(\\mu, \\sigma^2)"
references:
  - "Casella, G. and Berger, R. L. (2002). Statistical Inference, 2nd ed. Duxbury."
  - "Magalhães, M. N. (2015). Probabilidade e Variáveis Aleatórias, 3rd ed. Edusp."
  - "Leemis, L. M. and McQueston, J. T. (2008). Univariate distribution relationships. The American Statistician, 62(1), 45-53."
  - "Johnson, N. L., Kotz, S. and Balakrishnan, N. (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley."
  - "Forbes, C., Evans, M., Hastings, N. and Peacock, B. (2011). Statistical Distributions, 4th ed. Wiley."
  - "Lazo, A. V. and Rathie, P. N. (1978). On the entropy of continuous probability distributions. IEEE Transactions on Information Theory, 24(1), 120-122."
