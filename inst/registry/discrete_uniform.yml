id: discrete_uniform
names:
  en-US: Discrete uniform
  pt-BR: Uniforme discreta
type: discrete
group: counts
subgroup: uniform_family
tier: 1
support:
  lower: min
  upper: max
constraints:
  - "min < max"
parameters:
  - name: min
    latex: "a"
    lower: -.inf
    upper: .inf
    integer: true
    default: 1
    slider: {min: -20, max: 20, step: 1}
  - name: max
    latex: "b"
    lower: -.inf
    upper: .inf
    integer: true
    default: 6
    slider: {min: -20, max: 20, step: 1}
functions:
  d: extraDistr::ddunif
  p: extraDistr::pdunif
  q: extraDistr::qdunif
  r: extraDistr::rdunif
latex:
  pdf: "P(X = x) = \\frac{1}{b - a + 1}, \\quad x = a, a + 1, \\ldots, b"
  cdf: "F(x) = \\frac{\\lfloor x \\rfloor - a + 1}{b - a + 1}, \\quad a \\le x < b"
  quantile:
    - expr: "a - 1 + \\lceil u (b - a + 1) \\rceil"
      condition: "0 < u \\le 1"
    - expr: "a"
      condition: "u = 0"
  mean:
    expr: "\\frac{a + b}{2}"
  variance:
    expr: "\\frac{(b - a + 1)^{2} - 1}{12}"
  skewness:
    expr: "0"
  excess_kurtosis:
    expr: "-\\frac{6 \\left[(b - a + 1)^{2} + 1\\right]}{5 \\left[(b - a + 1)^{2} - 1\\right]}"
  mgf:
    - expr: "\\frac{e^{a t} - e^{(b + 1) t}}{(b - a + 1)\\left(1 - e^{t}\\right)}"
      condition: "t \\ne 0"
    - expr: "1"
      condition: "t = 0"
  cf:
    - expr: "\\frac{e^{i a t} - e^{i (b + 1) t}}{(b - a + 1)\\left(1 - e^{i t}\\right)}"
      condition: "\\frac{t}{2 \\pi} \\notin \\mathbb{Z}"
    - expr: "1"
      condition: "\\frac{t}{2 \\pi} \\in \\mathbb{Z}"
  pgf:
    - expr: "\\frac{z^{a} - z^{b + 1}}{(b - a + 1)(1 - z)}"
      condition: "z \\ne 1, a \\ge 0"
    - expr: "\\frac{z^{a} - z^{b + 1}}{(b - a + 1)(1 - z)}"
      condition: "z \\ne 0, z \\ne 1, a < 0"
    - expr: "1"
      condition: "z = 1"
    - status: undefined
      condition: "z = 0, a < 0"
  median:
    - expr: "\\frac{a + b}{2}"
      condition: "b - a \\in \\{2, 4, 6, \\ldots\\}"
    - expr: "\\left[\\frac{a + b - 1}{2}, \\frac{a + b + 1}{2}\\right]"
      condition: "b - a \\in \\{1, 3, 5, \\ldots\\}"
  mode:
    expr: "\\{a, a + 1, \\ldots, b\\}"
  entropy:
    expr: "\\log(b - a + 1)"
story:
  en-US: >-
    Pick one of the whole numbers a, a + 1, ..., b with no preference for any
    of them, like rolling a fair die (a = 1, b = 6). Each value has the same
    probability 1 / (b - a + 1). It is the natural model for a fair lottery
    draw.
  pt-BR: >-
    Escolha um dos números inteiros a, a + 1, ..., b sem preferência por
    nenhum deles, como ao lançar um dado honesto (a = 1, b = 6). Cada valor
    tem a mesma probabilidade 1 / (b - a + 1). É o modelo natural para um
    sorteio justo.
references:
  - "Casella, G. and Berger, R. L. (2002). Statistical Inference, 2nd ed. Duxbury."
  - "Bussab, W. O. and Morettin, P. A. (2017). Estatística Básica, 9th ed. Saraiva."
  - "Magalhães, M. N. (2015). Probabilidade e Variáveis Aleatórias, 3rd ed. Edusp."
  - "Johnson, N. L., Kemp, A. W. and Kotz, S. (2005). Univariate Discrete Distributions, 3rd ed. Wiley."
  - "Forbes, C., Evans, M., Hastings, N. and Peacock, B. (2011). Statistical Distributions, 4th ed. Wiley."
