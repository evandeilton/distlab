id: gamma
names:
  en-US: Gamma
  pt-BR: Gama
type: continuous
group: positive
subgroup: gamma_family
tier: 1
support:
  lower: 0
  lower_open: true
  upper: .inf
parameters:
  - name: shape
    latex: "\\alpha"
    lower: 0
    lower_open: true
    upper: .inf
    default: 2
    slider: {min: 0.1, max: 20, step: 0.1}
  - name: rate
    latex: "\\beta"
    lower: 0
    lower_open: true
    upper: .inf
    default: 1
    slider: {min: 0.1, max: 10, step: 0.1}
functions:
  d: stats::dgamma
  p: stats::pgamma
  q: stats::qgamma
  r: stats::rgamma
latex:
  pdf: "f(x) = \\frac{\\beta^{\\alpha}}{\\Gamma(\\alpha)} x^{\\alpha-1} e^{-\\beta x}, \\quad x > 0"
  cdf: "F(x) = \\frac{\\gamma(\\alpha, \\beta x)}{\\Gamma(\\alpha)}"
story:
  en-US: >-
    Events arrive at random at an average rate beta. The waiting time until
    the alpha-th event follows a Gamma distribution; for integer alpha it is
    the sum of alpha independent Exponential waiting times.
  pt-BR: >-
    Eventos chegam ao acaso a uma taxa média beta. O tempo de espera até o
    alfa-ésimo evento segue uma distribuição Gama; para alfa inteiro, é a
    soma de alfa tempos de espera Exponenciais independentes.
references:
  - "Casella, G. and Berger, R. L. (2002). Statistical Inference, 2nd ed. Duxbury."
  - "Magalhães, M. N. (2015). Probabilidade e Variáveis Aleatórias, 3rd ed. Edusp."
