id: student_t
names:
  en-US: Student's t
  pt-BR: t de Student
type: continuous
group: real_line
subgroup: t_family
tier: 1
support:
  lower: -.inf
  upper: .inf
parameters:
  - name: df
    latex: "\\nu"
    lower: 0
    lower_open: true
    upper: .inf
    default: 5
    slider: {min: 0.5, max: 50, step: 0.5}
functions:
  d: stats::dt
  p: stats::pt
  q: stats::qt
  r: stats::rt
latex:
  pdf: "f(x) = \\frac{\\Gamma\\left(\\frac{\\nu + 1}{2}\\right)}{\\sqrt{\\nu\\pi}\\, \\Gamma\\left(\\frac{\\nu}{2}\\right)} \\left(1 + \\frac{x^2}{\\nu}\\right)^{-(\\nu + 1)/2}"
  cdf: "F(x) = 1 - \\frac{1}{2} I_{\\nu / (x^2 + \\nu)}\\left(\\frac{\\nu}{2}, \\frac{1}{2}\\right), \\quad x \\ge 0"
story:
  en-US: >-
    Standardize a sample mean with the sample standard deviation instead of
    the true one, and the extra uncertainty fattens the tails. The result
    follows a Student t with nu degrees of freedom: a standard Normal divided
    by the square root of an independent Chi-square over nu. As nu grows it
    approaches the standard Normal.
  pt-BR: >-
    Padronize uma média amostral com o desvio-padrão amostral em vez do
    verdadeiro, e a incerteza extra engrossa as caudas. O resultado segue uma
    t de Student com nu graus de liberdade: uma Normal padrão dividida pela
    raiz de uma Qui-quadrado independente sobre nu. Conforme nu cresce, ela se
    aproxima da Normal padrão.
relationships:
  - to: cauchy
    type: special_case
    condition:
      en-US: "With one degree of freedom (nu = 1) the t is the standard Cauchy."
      pt-BR: "Com um grau de liberdade (nu = 1), a t é a Cauchy padrão."
    latex: "t_1 = \\mathrm{Cauchy}(0, 1)"
  - to: normal
    type: limit
    condition:
      en-US: "As nu grows, the t tends to the standard Normal."
      pt-BR: "Conforme nu cresce, a t tende à Normal padrão."
    latex: "t_\\nu \\xrightarrow{d} N(0, 1), \\quad \\nu \\to \\infty"
  - to: f
    type: transformation
    condition:
      en-US: "The square of a t variable with nu degrees of freedom is F(1, nu)."
      pt-BR: "O quadrado de uma variável t com nu graus de liberdade é F(1, nu)."
    latex: "T \\sim t_\\nu \\Rightarrow T^2 \\sim F(1, \\nu)"
references:
  - "Casella, G. and Berger, R. L. (2002). Statistical Inference, 2nd ed. Duxbury."
  - "Bussab, W. O. and Morettin, P. A. (2017). Estatística Básica, 9th ed. Saraiva."
  - "Magalhães, M. N. (2015). Probabilidade e Variáveis Aleatórias, 3rd ed. Edusp."
  - "Leemis, L. M. and McQueston, J. T. (2008). Univariate distribution relationships. The American Statistician, 62(1), 45-53."
