id: logistic
names:
  en-US: Logistic
  pt-BR: Logística
type: continuous
group: real_line
subgroup: symmetric_family
tier: 1
support:
  lower: -.inf
  upper: .inf
parameters:
  - name: location
    latex: "\\mu"
    lower: -.inf
    upper: .inf
    default: 0
    slider: {min: -10, max: 10, step: 0.1}
  - name: scale
    latex: "s"
    lower: 0
    lower_open: true
    upper: .inf
    default: 1
    slider: {min: 0.1, max: 10, step: 0.1}
functions:
  d: stats::dlogis
  p: stats::plogis
  q: stats::qlogis
  r: stats::rlogis
latex:
  pdf: "f(x) = \\frac{e^{-(x - \\mu)/s}}{s \\left(1 + e^{-(x - \\mu)/s}\\right)^2}"
  cdf: "F(x) = \\frac{1}{1 + e^{-(x - \\mu)/s}}"
  quantile:
    expr: "\\mu + s \\log\\frac{u}{1 - u}"
  mean:
    expr: "\\mu"
  variance:
    expr: "\\frac{s^{2} \\pi^{2}}{3}"
  skewness:
    expr: "0"
  excess_kurtosis:
    expr: "\\frac{6}{5}"
  mgf:
    expr: "e^{\\mu t} B(1 - s t, 1 + s t)"
    condition: "|t| < \\frac{1}{s}"
  cf:
    - expr: "e^{i \\mu t} \\frac{\\pi s t}{\\sinh(\\pi s t)}"
      condition: "t \\ne 0"
    - expr: "1"
      condition: "t = 0"
  median:
    expr: "\\mu"
  mode:
    expr: "\\mu"
  entropy:
    expr: "\\log s + 2"
story:
  en-US: >-
    Its CDF is the logistic curve that turns log-odds into probabilities, the
    same curve used in logistic regression. Draw a uniform probability U and
    take its log-odds log(U / (1 - U)): the result is standard Logistic. The
    shape is close to a Normal, with somewhat heavier tails.
  pt-BR: >-
    Sua função de distribuição é a curva logística que transforma o log da
    chance em probabilidade, a mesma usada na regressão logística. Sorteie uma
    probabilidade uniforme U e tome o log da chance log(U / (1 - U)): o
    resultado é Logística padrão. A forma é parecida com a da Normal, com
    caudas um pouco mais pesadas.
references:
  - "Casella, G. and Berger, R. L. (2002). Statistical Inference, 2nd ed. Duxbury."
  - "Leemis, L. M. and McQueston, J. T. (2008). Univariate distribution relationships. The American Statistician, 62(1), 45-53."
  - "Johnson, N. L., Kotz, S. and Balakrishnan, N. (1995). Continuous Univariate Distributions, Vol. 2, 2nd ed. Wiley."
  - "Forbes, C., Evans, M., Hastings, N. and Peacock, B. (2011). Statistical Distributions, 4th ed. Wiley."
  - "Lazo, A. V. and Rathie, P. N. (1978). On the entropy of continuous probability distributions. IEEE Transactions on Information Theory, 24(1), 120-122."
