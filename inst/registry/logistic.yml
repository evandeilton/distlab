id: logistic
names:
  en-US: Logistic
  pt-BR: Logística
type: continuous
group: real_line
subgroup: symmetric_family
tier: 1
support:
  lower: -.inf
  upper: .inf
parameters:
  - name: location
    latex: "\\mu"
    lower: -.inf
    upper: .inf
    default: 0
    slider: {min: -10, max: 10, step: 0.1}
  - name: scale
    latex: "s"
    lower: 0
    lower_open: true
    upper: .inf
    default: 1
    slider: {min: 0.1, max: 10, step: 0.1}
functions:
  d: stats::dlogis
  p: stats::plogis
  q: stats::qlogis
  r: stats::rlogis
latex:
  pdf: "f(x) = \\frac{e^{-(x - \\mu)/s}}{s \\left(1 + e^{-(x - \\mu)/s}\\right)^2}"
  cdf: "F(x) = \\frac{1}{1 + e^{-(x - \\mu)/s}}"
story:
  en-US: >-
    Its CDF is the logistic curve that turns log-odds into probabilities, the
    same curve used in logistic regression. Draw a uniform probability U and
    take its log-odds log(U / (1 - U)): the result is standard Logistic. The
    shape is close to a Normal, with somewhat heavier tails.
  pt-BR: >-
    Sua função de distribuição é a curva logística que transforma o log da
    chance em probabilidade, a mesma usada na regressão logística. Sorteie uma
    probabilidade uniforme U e tome o log da chance log(U / (1 - U)): o
    resultado é Logística padrão. A forma é parecida com a da Normal, com
    caudas um pouco mais pesadas.
references:
  - "Casella, G. and Berger, R. L. (2002). Statistical Inference, 2nd ed. Duxbury."
  - "Leemis, L. M. and McQueston, J. T. (2008). Univariate distribution relationships. The American Statistician, 62(1), 45-53."
